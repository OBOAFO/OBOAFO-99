<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Scientific Calculator</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.2/math.js"></script>
</head>
<body>

<div class="app">
  <h1>AI Scientific Calculator</h1>

  <div class="calculator">
    <!-- Display -->
    <div class="display">
      <input type="text" id="expression" placeholder="0" autocomplete="off" />
    </div>

    <!-- Mode tabs -->
    <div class="tabs">
      <button class="tab active" data-mode="keypad">Keypad</button>
      <button class="tab" data-mode="scan">Scan / AI Solve</button>
    </div>

    <!-- Keypad mode -->
    <div id="keypad-panel" class="panel active">
      <div class="buttons">
        <button data-val="sin(">sin</button>
        <button data-val="cos(">cos</button>
        <button data-val="tan(">tan</button>
        <button data-val="log(">log</button>
        <button data-val="ln(">ln</button>

        <button data-val="(">(</button>
        <button data-val=")">)</button>
        <button data-val="^">^</button>
        <button data-val="sqrt(">√</button>
        <button data-val="!" class="op">!</button>

        <button data-val="7">7</button>
        <button data-val="8">8</button>
        <button data-val="9">9</button>
        <button data-val="/" class="op">÷</button>
        <button data-val="pi">π</button>

        <button data-val="4">4</button>
        <button data-val="5">5</button>
        <button data-val="6">6</button>
        <button data-val="*" class="op">×</button>
        <button data-val="e">e</button>

        <button data-val="1">1</button>
        <button data-val="2">2</button>
        <button data-val="3">3</button>
        <button data-val="-" class="op">−</button>
        <button id="clear" class="op">C</button>

        <button data-val="0">0</button>
        <button data-val=".">.</button>
        <button data-val="%">%</button>
        <button data-val="+" class="op">+</button>
        <button id="equals" class="equals">=</button>
      </div>
    </div>

    <!-- Scan / AI mode -->
    <div id="scan-panel" class="panel">
      <p class="hint">Upload or take a photo of a math problem, or type a question in words — the AI will solve it step by step.</p>

      <input type="file" id="imageInput" accept="image/*" capture="environment" />
      <img id="preview" class="preview" style="display:none" />

      <textarea id="questionText" placeholder="Or type your question here, e.g. 'solve x^2 - 5x + 6 = 0' or 'derivative of sin(x)*x^2'"></textarea>

      <button id="solveAI" class="solve-btn">Solve with AI</button>

      <div id="aiStatus" class="status"></div>
      <div id="aiResult" class="result"></div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
